name: Python Package

on:
  push:
    branches: ["main", "dev"]
    paths:
      - ".github/workflows/python-package.yml"
      - "crates/rsfgseapy/**"
      - "crates/rsfgsea/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - ".github/workflows/python-package.yml"
      - "crates/rsfgseapy/**"
      - "crates/rsfgsea/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Install maturin and test deps
        run: python -m pip install --upgrade pip maturin==1.14.1 pytest==9.1.1

      - name: Build wheel
        working-directory: crates/rsfgseapy
        run: maturin build --release --out wheelhouse

      - name: Install built wheel and run binding tests
        working-directory: crates/rsfgseapy
        run: |
          python -m pip install --force-reinstall wheelhouse/*.whl
          pytest tests

  build:
    name: Build wheels and sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: 1.14.1
          command: build
          working-directory: crates/rsfgseapy
          rust-toolchain: 1.97.1
          args: --release --out wheelhouse ${{ matrix.os == 'ubuntu-latest' && '-i python3.14' || '' }}
          manylinux: auto

      - name: Build source distribution
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: 1.14.1
          command: sdist
          working-directory: crates/rsfgseapy
          rust-toolchain: 1.97.1
          args: --out sdist

      - name: Check built distributions
        shell: bash
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check crates/rsfgseapy/wheelhouse/*

      - name: Check source distribution
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check crates/rsfgseapy/sdist/*

      - name: Upload wheel distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dists-${{ matrix.os }}
          path: crates/rsfgseapy/wheelhouse/*

      - name: Upload source distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dists-${{ matrix.os }}-sdist
          path: crates/rsfgseapy/sdist/*
