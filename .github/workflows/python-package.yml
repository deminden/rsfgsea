name: Python Package

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/python-package.yml"
      - "crates/rsfgseapy/**"
      - "crates/rsfgsea/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/python-package.yml"
      - "crates/rsfgseapy/**"
      - "crates/rsfgsea/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python bindings
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install maturin and test deps
        run: python -m pip install --upgrade pip maturin pytest

      - name: Build wheel
        working-directory: crates/rsfgseapy
        run: maturin build --release --out wheelhouse

      - name: Install built wheel and run binding tests
        working-directory: crates/rsfgseapy
        run: |
          python -m pip install --force-reinstall wheelhouse/*.whl
          pytest tests

  build:
    name: Build wheels and sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: crates/rsfgseapy
          args: --release --out wheelhouse
          manylinux: auto

      - name: Build source distribution
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: crates/rsfgseapy
          args: --out sdist

      - name: Check built distributions
        shell: bash
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check crates/rsfgseapy/wheelhouse/*

      - name: Check source distribution
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python -m pip install --upgrade pip twine
          python -m twine check crates/rsfgseapy/sdist/*

      - name: Upload wheel distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dists-${{ matrix.os }}
          path: crates/rsfgseapy/wheelhouse/*

      - name: Upload source distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: python-dists-${{ matrix.os }}-sdist
          path: crates/rsfgseapy/sdist/*
