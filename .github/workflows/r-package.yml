name: R Package

on:
  push:
    paths:
      - "crates/rsfgsea/**"
      - "r-pkg/rsfgseaR/**"
      - "scripts/sync_r_vendor.sh"
      - ".github/workflows/r-package.yml"
  pull_request:
    paths:
      - "crates/rsfgsea/**"
      - "r-pkg/rsfgseaR/**"
      - "scripts/sync_r_vendor.sh"
      - ".github/workflows/r-package.yml"
  workflow_dispatch:

jobs:
  check-r-package:
    name: R CMD check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-pkg/rsfgseaR
          extra-packages: any::testthat
          needs: check

      - name: Verify R test dependencies
        run: |
          Rscript -e 'stopifnot(requireNamespace("testthat", quietly = TRUE)); packageVersion("testthat")'

      - name: Build source package
        run: |
          cd r-pkg
          R CMD build rsfgseaR

      - name: Check source package
        run: |
          cd r-pkg
          R CMD check rsfgseaR_*.tar.gz --no-manual
