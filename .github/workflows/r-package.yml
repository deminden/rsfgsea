name: R Package

on:
  push:
    paths:
      - "crates/rsfgsea/**"
      - "r-pkg/rsfgseaR/**"
      - "scripts/sync_r_vendor.sh"
      - ".github/workflows/r-package.yml"
  pull_request:
    paths:
      - "crates/rsfgsea/**"
      - "r-pkg/rsfgseaR/**"
      - "scripts/sync_r_vendor.sh"
      - ".github/workflows/r-package.yml"
  workflow_dispatch:

jobs:
  check-r-package:
    name: R CMD check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages("testthat", repos = "https://cloud.r-project.org")'

      - name: Build source package
        run: |
          cd r-pkg
          R CMD build rsfgseaR

      - name: Check source package
        run: |
          cd r-pkg
          R CMD check rsfgseaR_*.tar.gz --no-manual
