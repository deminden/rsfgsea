name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact_name: rsfgsea-x86_64-unknown-linux-gnu
            binary_name: rsfgsea
            archive_ext: tar.gz
          - name: macos-x86_64
            os: macos-latest
            artifact_name: rsfgsea-x86_64-apple-darwin
            binary_name: rsfgsea
            archive_ext: tar.gz
          - name: macos-aarch64
            os: macos-latest
            artifact_name: rsfgsea-aarch64-apple-darwin
            binary_name: rsfgsea
            archive_ext: tar.gz
          - name: windows-x86_64
            os: windows-latest
            artifact_name: rsfgsea-x86_64-pc-windows-msvc
            binary_name: rsfgsea.exe
            archive_ext: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1

      - name: Build CLI binary
        run: cargo build -p rsfgsea --release --bin rsfgsea

      - name: Package Unix artifact
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          cp target/release/${{ matrix.binary_name }} dist/${{ matrix.artifact_name }}/
          cp LICENSE dist/${{ matrix.artifact_name }}/
          cp README.md dist/${{ matrix.artifact_name }}/
          tar -C dist -czf dist/${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Package Windows artifact
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.artifact_name }} | Out-Null
          Copy-Item target/release/${{ matrix.binary_name }} dist/${{ matrix.artifact_name }}/
          Copy-Item LICENSE dist/${{ matrix.artifact_name }}/
          Copy-Item README.md dist/${{ matrix.artifact_name }}/
          Compress-Archive -Path dist/${{ matrix.artifact_name }} -DestinationPath dist/${{ matrix.artifact_name }}.zip -Force

      - name: Upload packaged artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  checksums:
    name: Create checksums
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: dist/SHA256SUMS

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build, checksums]

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*
          generate_release_notes: true
