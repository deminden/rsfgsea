name: Publish Python Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build Python distributions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: crates/rsfgseapy
          rust-toolchain: 1.96.0
          args: --release --out wheelhouse
          manylinux: auto

      - name: Build source distribution
        if: matrix.os == 'ubuntu-latest'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: crates/rsfgseapy
          rust-toolchain: 1.96.0
          args: --out sdist

      - name: Upload wheel distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dists-${{ matrix.os }}
          path: crates/rsfgseapy/wheelhouse/*

      - name: Upload source distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dists-${{ matrix.os }}-sdist
          path: crates/rsfgseapy/sdist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/rsfgseapy

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
