[package]
name = "rsfgsea"
version = "0.3.4"
edition = "2024"
authors = ["Denis Demin"]
description = "High-performance fgsea-compatible preranked Gene Set Enrichment Analysis in Rust"
license = "MIT"
documentation = "https://github.com/deminden/rsfgsea/tree/main/docs"
homepage = "https://github.com/deminden/rsfgsea"
repository = "https://github.com/deminden/rsfgsea"
autobins = false
readme = "README.md"

[[bin]]
name = "rsfgsea"
path = "src/main.rs"

[[bin]]
name = "rsfgsea-plot-enrichment"
path = "src/bin/plot_enrichment.rs"

[[bin]]
name = "rsfgsea-plot-gsea-table"
path = "src/bin/plot_gsea_table.rs"

[dependencies]
anyhow = "1.0.102"
ab_glyph = "0.2.32"
bytemuck = { version = "1.25.0", features = ["derive"], optional = true }
clap = { version = "4.6.0", features = ["derive"] }
csv = "1.4.0"
flate2 = "1.1.5"
flume = { version = "0.12.0", optional = true }
futures-intrusive = { version = "0.5.0", optional = true }
image = "0.25.10"
imageproc = "0.26.1"
itertools = "0.14.0"
log = "0.4.29"
ndarray = "0.17.2"
num_cpus = "1.17.0"
png = "0.18.1"
pollster = { version = "0.4.0", optional = true }
rand = "0.10.0"
rand_chacha = "0.10.0"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
special = "0.13.0"
statrs = "0.18.0"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"], optional = true }
wgpu = { version = "28.0.0", optional = true }

[dev-dependencies]
assert_cmd = "2.2.0"
criterion = "0.8.2"
predicates = "3.1.4"
rand_distr = "0.6.0"
tempfile = "3.27.0"

[features]
default = []
gpu = [
    "dep:bytemuck",
    "dep:flume",
    "dep:futures-intrusive",
    "dep:pollster",
    "dep:tokio",
    "dep:wgpu",
]

[[bench]]
name = "gsea_bench"
harness = false
