[package]
name = "rsfgsea"
version = "0.2.6"
edition = "2024"
authors = ["Denis Demin"]
description = "High-performance fgsea-compatible preranked Gene Set Enrichment Analysis in Rust"
license = "MIT"
documentation = "https://github.com/deminden/rsfgsea/tree/main/docs"
homepage = "https://github.com/deminden/rsfgsea"
repository = "https://github.com/deminden/rsfgsea"
autobins = false
readme = "README.md"

[[bin]]
name = "rsfgsea"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.13", features = ["derive"], optional = true }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
flate2 = "1.0"
flume = { version = "0.11", optional = true }
futures-intrusive = { version = "0.5", optional = true }
itertools = "0.13"
log = "0.4"
ndarray = "0.15"
num_cpus = "1.13"
pollster = { version = "0.3", optional = true }
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
special = "0.10"
statrs = "0.18"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
wgpu = { version = "23.0", optional = true }

[dev-dependencies]
assert_cmd = "2.0"
criterion = "0.4"
predicates = "3.1"
rand_distr = "0.4"
tempfile = "3.13"

[features]
default = []
gpu = [
    "dep:bytemuck",
    "dep:flume",
    "dep:futures-intrusive",
    "dep:pollster",
    "dep:tokio",
    "dep:wgpu",
]

[[bench]]
name = "gsea_bench"
harness = false
