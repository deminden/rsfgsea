[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "rsfgseapy"
version = "0.2.6"
description = "Fast Gene Set Enrichment Analysis in Rust (Python bindings)"
authors = [{name = "Denis Demin"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
keywords = ["bioinformatics", "gsea", "fgsea", "gene-set-enrichment", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/deminden/rsfgsea"
Repository = "https://github.com/deminden/rsfgsea"
Documentation = "https://github.com/deminden/rsfgsea/tree/main/docs"
Issues = "https://github.com/deminden/rsfgsea/issues"

[project.optional-dependencies]
test = ["pytest>=9", "maturin>=1.0,<2.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "rsfgseapy"
