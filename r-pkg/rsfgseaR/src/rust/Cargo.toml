[package]
name = 'rsfgsea_r'
publish = false
version = '0.4.0'
edition = '2024'
rust-version = '1.97.1'

[lib]
crate-type = [ 'staticlib' ]
name = 'rsfgseaR'

[dependencies]
extendr-api = '0.9.0'
rayon = '1.12.0'
rsfgsea = { path = './vendor/rsfgsea' }

[features]
default = []
gpu = ['rsfgsea/gpu']

[profile.release]
lto = true
codegen-units = 1
debug = 0
strip = "symbols"

[workspace]
